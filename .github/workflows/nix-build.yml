name: Nix Build Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix run .#build (dry-run)
    # darwinConfigurations target aarch64-darwin; macos-latest runners are Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      # orca-automations is a private repository. The public check does not
      # fetch it: it is replaced with a stub, so no credentials are needed.
      # Its own contents are tested in valbeat/orca-automations.
      - name: Dry-run build
        run: nix run .#build -- --override-input orca-automations "path:$PWD/ci/orca-automations-stub"
