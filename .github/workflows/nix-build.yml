name: Nix Build Check

on:
  pull_request:
  # Dispatched by flake-update.yml: pull requests opened with GITHUB_TOKEN do
  # not trigger pull_request workflows, but workflow_dispatch runs do, and their
  # check runs show up on the pull request's head commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix run .#build (dry-run)
    # darwinConfigurations target aarch64-darwin; macos-latest runners are Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same Nix distribution as the host (Determinate Nix 3).
      - uses: DeterminateSystems/determinate-nix-action@v3

      # flake.lock health: warns when nixpkgs is old or not a supported branch.
      - uses: DeterminateSystems/flake-checker-action@v14
        with:
          send-statistics: false

      # orca-automations is a private repository. The public check does not
      # fetch it: it is replaced with a stub, so no credentials are needed.
      # Its own contents are tested in valbeat/orca-automations.
      - name: Dry-run build
        run: nix run .#build -- --override-input orca-automations "path:$PWD/ci/orca-automations-stub"
