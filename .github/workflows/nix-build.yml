name: Nix Build Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix run .#build (dry-run)
    # darwinConfigurations target aarch64-darwin; macos-latest runners are Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      # The orca-automations flake input is a private repository fetched as
      # git+ssh locally. CI has no SSH key, so rewrite that URL to HTTPS with a
      # fine-grained, read-only token scoped to that one repository.
      - name: Allow fetching the private orca-automations input
        env:
          ORCA_AUTOMATIONS_TOKEN: ${{ secrets.ORCA_AUTOMATIONS_TOKEN }}
        run: |
          if [ -z "$ORCA_AUTOMATIONS_TOKEN" ]; then
            echo "::error::secret ORCA_AUTOMATIONS_TOKEN is not set (read-only token for valbeat/orca-automations)"
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${ORCA_AUTOMATIONS_TOKEN}@github.com/valbeat/orca-automations".insteadOf \
            "ssh://git@github.com/valbeat/orca-automations"

      - name: Dry-run build
        run: nix run .#build
